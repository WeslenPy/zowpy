[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zowpy"
version = "1.1.0"
description = "Modern async WhatsApp client library - Zero threads, zero sleeps, just await"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "ZowPy maintainers" }
]
keywords = ["whatsapp", "async", "axolotl", "noise", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
]

dependencies = [
    "aiosqlite>=0.19.0",
    "protobuf (==5.29.5)",
    "betterproto (==1.2.5)",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "dissononce (==0.34.3)",
    "transitions>=0.9.0",
    "pycryptodome (==3.23.0)",
    "python-axolotl-curve25519 (>=0.4.1.post2)",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "requests>=2.31.0",
    "sqlalchemy (==2.0.45)",
    "alembic>=1.13.0",
    "PySocks>=1.7.1",
    "pydub (>=0.25.1,<0.26.0)",
    "mutagen (>=1.47.0,<2.0.0)",
    "opencv-python (>=4.12.0.88,<5.0.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "names (>=0.3.0,<0.4.0)",
    "socksio (>=1.0.0,<2.0.0)",
    "cryptography (==46.0.3)",
    "zargo @ git+https://github.com/WeslenPy/zargo.git",
    "aiomysql (>=0.3.2,<0.4.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]


[tool.setuptools.package-data]
"zowpy" = [

    # Arquivos protobuf (.proto) - necessários para referência e geração de código
    "proto/*",
    "*.proto",
    "*.argo",
    "*.zip",
    
    # Arquivos de tipos MIME - usado por MimeTools.getMIME()
    "*.types",
    
    # Templates JSON (se houver)
    "*.json"
]



[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = true



[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
